# Builds the mod on every push and pull request, then runs the in-game test (src/gametest) on a
# virtual display, so a broken build or a crash in game shows up straight away. The test also runs
# with each optional mod the mod works with installed (JEI, REI), and on Minecraft 26.2. The built jars
# are attached to each run under "Artifacts", and the game test's screenshots alongside them.

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # A pull request from a branch in this repo is already built by its push; only build forks' twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: 'on its own'
            test_args: ''
          - variant: 'with JEI'
            test_args: '-PtestViewer=jei'
          - variant: 'with REI'
            test_args: '-PtestViewer=rei'
          - variant: 'Minecraft 26.2'
            test_args: '-Pminecraft_version=26.2 -Pfabric_api_version=0.161.0+26.2 -Pneoforge_version=26.2.0.93'
          - variant: 'Minecraft 26.2 with JEI'
            test_args: '-Pminecraft_version=26.2 -Pfabric_api_version=0.161.0+26.2 -Pneoforge_version=26.2.0.93 -PtestViewer=jei'
    name: build (${{ matrix.variant }})
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: the jar only calls what 26.2 has
        # The jar players get is built against 26.3. A game method that kept its name but changed
        # its return type compiles on both versions and still crashes on 26.2, so check the jar
        # itself against 26.2's game code (fetched by compiling for 26.2).
        if: matrix.variant == 'on its own'
        run: |
          cp fabric/build/libs/pocket-list-fabric-*[0-9].jar /tmp/pocket-list.jar
          ./gradlew :fabric:compileJava -Pminecraft_version=26.2 -Pfabric_api_version=0.161.0+26.2 -Pneoforge_version=26.2.0.93
          node tools/check-linkage.js /tmp/pocket-list.jar "$(find ~/.gradle/caches/fabric-loom -name 'minecraft-merged-deobf-26.2.jar' | head -1)"
      - name: install EGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libegl-mesa0
      - name: run game test
        # 26.3 asks for an sRGB-capable window, which Xvfb's GLX can't give, so the game would
        # hang at startup. Mesa's EGL can; SDL uses it with this set.
        env:
          SDL_VIDEO_FORCE_EGL: '1'
        timeout-minutes: 15
        run: xvfb-run -a ./gradlew :fabric:runClientGameTest ${{ matrix.test_args }}
      - name: run NeoForge game test
        # The NeoForge jar's checks (neoforge/src/clienttest). A failed check crashes the game, which
        # fails this step; the crash report is uploaded with the screenshots.
        if: always() && (matrix.variant == 'on its own' || matrix.variant == 'Minecraft 26.2')
        env:
          SDL_VIDEO_FORCE_EGL: '1'
        timeout-minutes: 12
        run: xvfb-run -a ./gradlew :neoforge:runClientTest ${{ matrix.test_args }}
      - name: capture game test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Game test screenshots (${{ matrix.variant }})
          path: |
            fabric/build/run/clientGameTest/screenshots/
            neoforge/build/run/clientTest/screenshots/
            neoforge/build/run/clientTest/crash-reports/
          if-no-files-found: ignore
      - name: capture build artifacts
        if: matrix.variant == 'on its own'
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            fabric/build/libs/
            neoforge/build/libs/
