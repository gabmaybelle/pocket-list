// Shared settings for the three subprojects. Each subproject's own build.gradle says how it
// compiles; versions live in gradle.properties.
subprojects {
	apply plugin: 'java'

	group = rootProject.group
	version = rootProject.version

	repositories {
		mavenCentral()
		// Recipe viewers (compile only; not bundled or required).
		maven { url = 'https://maven.shedaniel.me/' }
		exclusiveContent {
			forRepository {
				maven { url = 'https://api.modrinth.com/maven' }
			}
			filter {
				includeGroup 'maven.modrinth'
			}
		}
	}

	// 1.20.1 runs on Java 17, so everything is compiled for it, whichever JDK does the compiling.
	tasks.withType(JavaCompile).configureEach {
		it.options.release = 17
		it.options.encoding = 'UTF-8'
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}

	// Captured outside the closure: the configuration cache can't serialise `rootProject` itself.
	def licenseSuffix = "_" + rootProject.name
	jar {
		from(rootProject.file('LICENSE')) {
			rename { it + licenseSuffix }
		}
	}
}
