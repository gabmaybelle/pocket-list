modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/gabmaybelle/pocket-list/issues"

[[mods]]
modId = "pocket_list"
version = "${version}"
displayName = "Pocket List"
# Client only: a server never needs it, and a client with it joins any server.
displayTest = "IGNORE_ALL_VERSION"
authors = "Gabby"
displayURL = "https://github.com/gabmaybelle/pocket-list"
logoFile = "assets/pocket_list/icon.png"
description = '''A little checklist in the corner of your screen. Add items by name or pin them from your inventory, recipe book, JEI or REI; break things down into their ingredients; and watch the list tick itself off as you gather from your inventory, the boxes and bundles you carry, and the chests you've opened nearby.'''

[[dependencies.pocket_list]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.pocket_list]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.20.2)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.pocket_list]]
modId = "jei"
mandatory = false
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

[[dependencies.pocket_list]]
modId = "roughlyenoughitems"
mandatory = false
versionRange = "*"
ordering = "NONE"
side = "CLIENT"
