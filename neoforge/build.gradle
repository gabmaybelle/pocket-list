plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

// The common sources are compiled straight into this jar, the same as the Fabric side.
sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
}
// The in-game test (src/clienttest): part of the mod only in dev runs, never in the jar.
sourceSets {
	clienttest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

neoForge {
	version = project.neoforge_version
	addModdingDependenciesTo(sourceSets.clienttest)

	mods {
		"pocket_list" {
			sourceSet sourceSets.main
			// The same mod as the main sources, so the test can reach the package's own classes.
			sourceSet sourceSets.clienttest
		}
	}

	runs {
		client {
			client()
		}
		// `./gradlew :neoforge:runClientTest`: starts the game, makes a flat world, runs the checks in
		// src/clienttest and closes. A failed check crashes the game, so the task fails. Needs a display.
		clientTest {
			client()
			systemProperty 'pocket_list.clienttest', 'true'
			gameDirectory = project.file('build/run/clientTest')
		}
	}
}

// Every test run starts as a new player would: no saved lists (the welcome note shows), no
// remembered chests. The run folder is kept between runs otherwise.
def clientTestConfig = file('build/run/clientTest/config')
tasks.matching { it.name == 'runClientTest' }.configureEach {
	doFirst {
		delete new File(clientTestConfig, 'pocket_list.json'), new File(clientTestConfig, 'pocket_list.json.broken'), new File(clientTestConfig, 'pocket_list')
	}
}

dependencies {
	// Recipe viewers: compiled against their NeoForge builds; not bundled or required.
	// (Modrinth version ids: JEI 19.27.0.346, REI 16.0.799, Cloth Config 15.0.140, Architectury 13.0.11.)
	compileOnly "maven.modrinth:jei:eBag7ypX"
	compileOnly "maven.modrinth:rei:b8gfS9Je"
	compileOnly "maven.modrinth:cloth-config:izKINKFg"
	compileOnly "maven.modrinth:architectury-api:1IiqEQGl"
	compileOnly "me.shedaniel.cloth:basic-math:0.6.1"

	// `./gradlew :neoforge:runClientTest -PtestViewer=jei` (or rei) runs the in-game test with that
	// viewer's NeoForge build installed.
	if (project.findProperty("testViewer") == "jei") {
		runtimeOnly "maven.modrinth:jei:eBag7ypX"
	} else if (project.findProperty("testViewer") == "rei") {
		runtimeOnly "maven.modrinth:rei:b8gfS9Je"
		runtimeOnly "maven.modrinth:cloth-config:izKINKFg"
		runtimeOnly "maven.modrinth:architectury-api:1IiqEQGl"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": version
	}
}

tasks.named('jar') { archiveBaseName = "${rootProject.name}-neoforge" }
tasks.named('sourcesJar') { archiveBaseName = "${rootProject.name}-neoforge" }
