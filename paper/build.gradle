// The Paper plugin: pocket-list-paper-<version>.jar, for servers that run Paper. It is written
// against the Paper API only (no Minecraft classes, no mixins, nothing from `common`), so one jar
// runs on every Paper build of its Minecraft version. The list lives on the server and is shown in
// the scoreboard sidebar; every key the mod has is a /pocket command here.
plugins {
	id 'xyz.jpenilla.run-paper' version "${run_paper_version}"
}

repositories {
	maven {
		name = 'papermc'
		url = 'https://repo.papermc.io/repository/maven-public/'
	}
}

dependencies {
	// Versions are in gradle.properties. The server provides the API (and Gson) at run time, so
	// neither is bundled.
	compileOnly "io.papermc.paper:paper-api:${project.paper_api_version}"
	testImplementation "io.papermc.paper:paper-api:${project.paper_api_version}"
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The pure parts (entries, the list, the breakdown maths, the text) have plain unit tests, no
// server needed: `./gradlew :paper:test`.
test {
	useJUnitPlatform()
	testLogging { events 'failed'; exceptionFormat 'full' }
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("plugin.yml") {
		expand "version": version
	}
}

// `./gradlew :paper:runServer` downloads a Paper server into paper/run and starts it with the plugin
// (a console, no window). tools/paper-server-test.js is the headless test.
tasks.named('runServer') {
	minecraftVersion '26.3'
}

tasks.named('jar') { archiveFileName = "${rootProject.name}-paper-${project.version}.jar" }
tasks.named('sourcesJar') { archiveFileName = "${rootProject.name}-paper-${project.version}-sources.jar" }
