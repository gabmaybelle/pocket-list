// Loader-neutral code. This project is compiled on its own so a Fabric or NeoForge import can't
// sneak in: only Minecraft, Mixin, the recipe viewers' APIs and the JDK are on the classpath.
// Nothing here ships as a jar; `fabric` and `neoforge` compile these sources into theirs.
plugins {
	id 'fabric-loom' version "${loom_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.1 ships obfuscated: the code is written in the official Mojang names and Loom remaps.
	mappings loom.officialMojangMappings()
	// Only for the Mixin annotations and the launch-side classes they need. No Fabric API here.
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Recipe viewers: pin from their screens and borrow their recipes; not bundled or required.
	// Their NeoForge builds, which use the same Mojang names as this code, so Loom leaves them alone:
	// remapped here, without Fabric API, a Fabric build came out half-renamed and broke the Fabric
	// test run that shared the copy. (Modrinth version ids: JEI 19.27.0.346, REI 16.0.799,
	// Cloth Config 15.0.140, Architectury 13.0.11.)
	compileOnly "maven.modrinth:jei:eBag7ypX"
	compileOnly "maven.modrinth:rei:b8gfS9Je"
	compileOnly "maven.modrinth:cloth-config:izKINKFg"
	compileOnly "maven.modrinth:architectury-api:1IiqEQGl"
	compileOnly "me.shedaniel.cloth:basic-math:0.6.1"
}

loom {
	mods {
		"pocket_list" {
			sourceSet sourceSets.main
		}
	}
}
