pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Gradle downloads the Java 17 that Forge's tools and the game test runs need when the computer has
// none (into ~/.gradle/jdks), so no machine-specific Java path has to be passed.
plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'pocket-list'

// `common` holds everything that doesn't care which loader it runs on. `fabric` and `forge`
// compile those sources straight into their own jars (see their build.gradle), so there is one
// codebase and two mod files.
include 'common', 'fabric', 'forge'
